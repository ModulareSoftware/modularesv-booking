<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sin conexión — Modulare Flex Office</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f8fafc; color: #1e293b; font-family: -apple-system, 'DM Sans', system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px 24px; max-width: 340px; text-align: center; }
    img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { font-size: 14px; color: #64748b; margin: 0 0 18px; line-height: 1.45; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 15px; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/Logo%20M%20Negro.png" alt="Modulare" />
    <h1>Sin conexión a internet</h1>
    <p>Revisa tu conexión y vuelve a intentarlo. Tus reservas están seguras.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
